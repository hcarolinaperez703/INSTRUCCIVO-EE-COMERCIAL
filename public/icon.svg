<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b2b"/>
      <stop offset="50%" stop-color="#0F3D66"/>
      <stop offset="100%" stop-color="#1F5E99"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#4A90E2"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Card Rounded Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid lines -->
  <path d="M64 256h384M256 64v384" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="160" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="110" stroke="url(#accentGrad)" stroke-width="4" opacity="0.4"/>
  
  <!-- Stylized Monogram AIDEX 'A' with Target & Growth Needle -->
  <path d="M256 120 L350 330 L300 330 L275 270 L237 270 L212 330 L162 330 Z" fill="url(#accentGrad)" filter="url(#glow)"/>
  <polygon points="256,180 285,245 227,245" fill="#0b1b2b"/>
  
  <!-- Dynamic Orbit Point / Pulse -->
  <circle cx="350" cy="180" r="16" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="350" cy="180" r="8" fill="#FFFFFF"/>
  
  <!-- Bottom Brand Text -->
  <text x="256" y="420" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="4">AIDEX 0.7</text>
  <text x="256" y="452" text-anchor="middle" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" letter-spacing="2">INDUCCIÓN COMERCIAL</text>
</svg>
